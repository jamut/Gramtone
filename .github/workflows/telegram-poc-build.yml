name: Build Telegram PoC APK

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build FOSS debug APK
        run: ./gradlew --console=plain :app:assembleFossDebug -x lint --warning-mode summary

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: metrolist-telegram-poc-apk
          path: app/build/outputs/apk/**/*.apk
